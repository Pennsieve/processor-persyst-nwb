# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json
schemaVersion: '1.0'
name: Processor Persyst NWB
description: Convert a Persyst recording (.lay + .dat) into a NWB file
applicationType: processor
runtime:
  computeTypes:
    - standard
resources:
  cpu: 4096
  memory: 12288
parameters:
  - name: OUTPUT_FILENAME
    type: string
    description: Bare filename (no path) for the NWB output file; defaults to a derived name if unset
    default: ''
  - name: PERSYST_TIMEZONE
    type: string
    description: IANA timezone name used to interpret the recording's wall-clock start time
    default: UTC
  - name: CHUNK_TARGET_BYTES
    type: number
    description: Target byte size for one HDF5 chunk of sample/timestamp data
    default: 4194304
    min: 1
  - name: COMPRESSION_LEVEL
    type: number
    description: Target compression level for NWB output file
    default: 4
    min: 0
    max: 9
  - name: STRIP_REF_SUFFIX
    type: boolean
    description: Whether to strip the reference-electrode suffix from channel names
    default: false
  - name: WRITE_COMMENTS
    type: boolean
    description: Whether to include Persyst [Comments] annotations as a NWB TimeIntervals table
    default: true
  - name: WRITE_SUBJECT_METADATA
    type: boolean
    description: Whether or not to include PII in the NWB output file
    default: false
