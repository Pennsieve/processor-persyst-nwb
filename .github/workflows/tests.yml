name: Tests

on:
  push:
    branches: [main]
  pull_request:

# No job in this workflow writes to the repository, or publishes an artifact.
permissions:
  contents: read

# A new push cancels a run that is still active on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, and not to tags. A tag can move.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.lock

      # --require-hashes, so that CI tests the versions in the image.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-test.lock

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=processor --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.lock

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-test.lock

      - name: Run linter
        run: ruff check processor/ tests/ --output-format=github

      - name: Check formatting
        run: ruff format --check processor/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-test.lock

      - name: Run mypy
        run: mypy processor/

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Shows that the digest-pinned base and the lock file still build.
      - name: Build the image
        run: docker build -t processor-persyst-nwb:ci .

      # The `import pynwb` statement writes a schema cache before the converter
      # starts. The image must therefore work with any UID that the platform
      # selects, and not only with root or with appuser. An arbitrary UID is the
      # condition that failed before.
      - name: Entrypoint imports under an arbitrary UID
        run: |
          docker run --rm --user 4242:4242 processor-persyst-nwb:ci \
            python3.12 -c 'import processor.main; print("import OK")'

      - name: Convert a synthetic recording end to end
        run: |
          mkdir -p ci-data/input ci-data/output
          python -c "
          import numpy as np
          n, rate = 800, 200.0
          data = np.column_stack([
              np.arange(n), np.arange(n) + 1000
          ]).astype('<i2')
          open('ci-data/input/rec.dat','wb').write(data.tobytes())
          open('ci-data/input/rec.lay','w').write(
              '[FileInfo]\nFile=rec.dat\nFileType=Interleaved\n'
              f'SamplingRate={rate:g}\nHeaderLength=0\nCalibration=1\n'
              'WaveformCount=2\nDataType=0\n[ChannelMap]\nA=1\nB=2\n')
          "
          docker run --rm --user 4242:4242 \
            -e INPUT_DIR=/data/input -e OUTPUT_DIR=/data/output \
            -v "$PWD/ci-data/input":/data/input:ro \
            -v "$PWD/ci-data/output":/data/output \
            processor-persyst-nwb:ci
          test -s ci-data/output/rec.nwb
