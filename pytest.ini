[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# There is no filter for DeprecationWarning. The dependencies are pinned with
# hashes, so an upstream deprecation appears when you update a lock file. Such a
# warning is the first sign that pynwb or hdmf will change the output format.
